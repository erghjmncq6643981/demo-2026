server:
  port: 16681
spring:
  application:
    name: client-demo
  config:
    import: optional:file:./config/application-local.yaml

  datasource:
    username: micro
    password: 123456
    url: jdbc:mysql://localhost:3306/study?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&autoReconnectForPools=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-packag: com.chandler.*.domain

info:
  app:
    name: ${spring.application.name}
    description: @project.description@
    version: project.build.sourceEncoding@
    java:
      version: @java.version@

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

learning:
  security:
    jwt-secret: ${LEARNING_JWT_SECRET:dev-learning-assistant-jwt-secret-change-me}
    jwt-issuer: ${LEARNING_JWT_ISSUER:learning-assistant}
    jwt-expire-days: ${LEARNING_JWT_EXPIRE_DAYS:30}
    api-key-secret: ${LEARNING_API_KEY_SECRET:dev-learning-assistant-api-key-secret-change-me}
  ai:
    default-provider: deepseek
    providers:
      deepseek:
        enabled: true
        base-url: https://api.deepseek.com
        chat-path: /chat/completions
        api-key: ${DEEPSEEK_API_KEY:}
        default-model: deepseek-chat
      kimi:
        enabled: true
        base-url: https://api.moonshot.cn
        chat-path: /v1/chat/completions
        api-key: ${KIMI_API_KEY:}
        default-model: moonshot-v1-8k
      doubao:
        enabled: false
        base-url: ${DOUBAO_BASE_URL:}
        chat-path: /chat/completions
        api-key: ${DOUBAO_API_KEY:}
        default-model: ${DOUBAO_MODEL:}
      yuanbao:
        enabled: false
        base-url: ${YUANBAO_BASE_URL:}
        chat-path: /chat/completions
        api-key: ${YUANBAO_API_KEY:}
        default-model: ${YUANBAO_MODEL:}
