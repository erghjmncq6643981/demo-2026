server:
  port: 16681
spring:
  application:
    name: client-demo
  config:
    import: optional:file:./config/application-local.yaml

  datasource:
    username: ${LEARNING_DB_USERNAME:micro}
    password: ${LEARNING_DB_PASSWORD:123456}
    url: ${LEARNING_DB_URL:jdbc:mysql://localhost:3306/study?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&autoReconnectForPools=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 100
      max-wait: 5000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  flyway:
    enabled: ${LEARNING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 107
    validate-on-migrate: true
    clean-disabled: true


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: >-
    com.chandler.learning.agent.identity.domain,
    com.chandler.learning.agent.vocabulary.domain,
    com.chandler.learning.agent.learning.domain,
    com.chandler.learning.agent.reading.domain,
    com.chandler.learning.agent.task.domain,
    com.chandler.learning.agent.system.domain,
    com.chandler.learning.agent.common.persistence
  configuration:
    map-underscore-to-camel-case: true

info:
  app:
    name: ${spring.application.name}
    description: @project.description@
    version: "@project.version@"
    java:
      version: @java.version@

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

learning:
  ai:
    http:
      connect-timeout: ${LEARNING_AI_CONNECT_TIMEOUT:15s}
      read-timeout: ${LEARNING_AI_READ_TIMEOUT:300s}
      proxy:
        host: ${LEARNING_AI_HTTP_PROXY_HOST:127.0.0.1}
        port: ${LEARNING_AI_HTTP_PROXY_PORT:7897}
    audit:
      # 生产默认只保留请求/响应摘要；本地排障可显式设置为 true。
      store-content: ${LEARNING_AI_AUDIT_STORE_CONTENT:false}
      max-content-length: ${LEARNING_AI_AUDIT_MAX_CONTENT_LENGTH:120000}
    task:
      core-pool-size: ${LEARNING_AI_TASK_CORE_POOL_SIZE:2}
      max-pool-size: ${LEARNING_AI_TASK_MAX_POOL_SIZE:4}
      queue-capacity: ${LEARNING_AI_TASK_QUEUE_CAPACITY:50}
      keep-alive-seconds: ${LEARNING_AI_TASK_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${LEARNING_AI_TASK_AWAIT_TERMINATION_SECONDS:30}
  audit-log:
    core-pool-size: ${LEARNING_AUDIT_LOG_CORE_POOL_SIZE:1}
    max-pool-size: ${LEARNING_AUDIT_LOG_MAX_POOL_SIZE:2}
    queue-capacity: ${LEARNING_AUDIT_LOG_QUEUE_CAPACITY:200}
    keep-alive-seconds: ${LEARNING_AUDIT_LOG_KEEP_ALIVE_SECONDS:30}
    await-termination-seconds: ${LEARNING_AUDIT_LOG_AWAIT_TERMINATION_SECONDS:10}
    recovery-delay-ms: ${LEARNING_AUDIT_LOG_RECOVERY_DELAY_MS:30000}
  security:
    jwt-secret: ${LEARNING_JWT_SECRET:dev-learning-assistant-jwt-secret-change-me}
    jwt-issuer: ${LEARNING_JWT_ISSUER:learning-assistant}
    jwt-expire-days: ${LEARNING_JWT_EXPIRE_DAYS:7}
    api-key-secret: ${LEARNING_API_KEY_SECRET:dev-learning-assistant-api-key-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
