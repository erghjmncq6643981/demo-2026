server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: fcc-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:chandler26_fcc}?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:fcc}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath*:mapper/*.xml
  global-config:
    banner: false
    db-config:
      id-type: input

fcc:
  agent:
    acw-timeout-seconds: ${FCC_ACW_TIMEOUT_SECONDS:30}
  outbound:
    enabled: ${FCC_OUTBOUND_ENABLED:false}
    max-in-flight: ${FCC_OUTBOUND_MAX_IN_FLIGHT:5}
    poll-millis: ${FCC_OUTBOUND_POLL_MILLIS:2000}
    start-hour: ${FCC_OUTBOUND_START_HOUR:9}
    end-hour: ${FCC_OUTBOUND_END_HOUR:18}
    timezone: ${FCC_OUTBOUND_TIMEZONE:Asia/Shanghai}
    # Java 只发送业务文案；Sidecar 使用配置的 TTS provider 合成共享音频。
  inbound:
    # 服务评价和结束语音为预设共享音频或 TTS 文本，必须同时配置才启用评价流程。
    service-rating-prompt-file: ${FCC_SERVICE_RATING_PROMPT_FILE:为了不断提升我们的服务质量，请对本次服务进行评价：非常满意请按1，满意请按2，基本满意请按3，不满意请按4，非常不满意请按5。}
    closing-prompt-file: ${FCC_CLOSING_PROMPT_FILE:非常感谢您的评价，祝您生活愉快，再见！}
  binding:
    # 提示与结果文案来自 SYSTEM_PHONE_BINDING，Java 不配置 FreeSWITCH 音频路径。
    work-no-min-digits: ${FCC_BINDING_WORK_NO_MIN_DIGITS:2}
    work-no-max-digits: ${FCC_BINDING_WORK_NO_MAX_DIGITS:20}
  admin:
    base-url: ${FCC_ADMIN_BASE_URL:http://127.0.0.1:8089}
  websocket:
    allowed-origins: ${FCC_WS_ALLOWED_ORIGINS:"*"}
  flow:
    reload-token: ${FCC_FLOW_RELOAD_TOKEN:local-flow-token-dev}
  nats-url: ${NATS_URL:nats://127.0.0.1:4222}
  ctrl-id-prefix: fcc-ctrl
  rpc-timeout-millis: 5000
  sidecar-admin-url: ${SIDECAR_ADMIN_URL:http://127.0.0.1:8088}
  # 通话录音共享存储：FreeSWITCH 容器与 FCC 服务必须以完全相同的绝对路径挂载该目录。
  # 下发录音指令时会在 base-dir 之下按 yyyy/MM/dd 分层生成 {call_id}.wav 的绝对路径，
  # FreeSWITCH 写入同一路径，控制面据此落库，管理端再从同一路径复播与下载。
  # 本地演示默认落到 ~/fcc-records（随当前用户 home 展开）；生产用 FCC_RECORDING_BASE_DIR 指定共享挂载点。
  recording:
    base-dir: ${FCC_RECORDING_BASE_DIR:${user.home}/fcc-records}
    sub-dir-pattern: yyyy/MM/dd
    file-format: wav
    # 生产环境请保持 false：仅允许读取共享录音目录之内的文件，防止任意文件读取
    allow-outside-base-dir: false
    stream-buffer-bytes: 8192

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.chandler.fcc: DEBUG
    org.springframework: INFO


