        <section class="view" id="reviewView">
            <section class="review-header panel" id="reviewHeaderPanel">
              <div class="review-header-bar">
                <div class="review-mode-tabs" id="reviewModeTabs" role="tablist" aria-label="复习来源切换">
                  <button type="button" class="review-mode-tab active" data-review-mode="recent" role="tab" aria-selected="true">🔍 近期查词</button>
                  <button type="button" class="review-mode-tab" data-review-mode="wordbook" role="tab" aria-selected="false">📚 词本抽查</button>
                </div>
                <div class="review-recent-meta" id="reviewRecentMeta">
                  <button class="secondary-button compact" id="refreshRecentReviewBtn" type="button">刷新列表</button>
                </div>
                <div class="review-start-controls hidden" id="reviewWordbookControls">
                  <label class="compact-field">
                    <span>单词本</span>
                    <select id="reviewWordbookSelect"></select>
                  </label>
                  <label class="compact-field small-field">
                    <span>数量</span>
                    <input id="reviewLimitInput" type="number" min="1" max="100" value="10" />
                  </label>
                  <button class="primary-button compact-primary" id="reloadReviewBtn" type="button">开始复习</button>
                </div>
              </div>
            </section>

            <div class="review-layout" id="reviewLayout">
              <section class="panel review-focus">
                <div class="review-focus-heading">
                  <span class="mini-pill clickable-pill" id="reviewProgressBadge" title="点击查看复习词单全览" role="button" tabindex="0">0 / 0</span>
                  <div class="inline-actions">
                    <button class="secondary-button compact" id="openReviewQueueModalBtn" type="button" title="查看本轮复习词单全览">词单全览</button>
                    <button class="secondary-button compact" id="toggleReviewFocusModeBtn" type="button" disabled>专注模式</button>
                  </div>
                </div>
                <div id="reviewFocus" class="empty">正在为你整理近期搜索过的词汇...</div>
              </section>

              <!-- 复习笔记侧边栏 -->
              <aside class="panel review-note-panel hidden" id="reviewNoteModal" aria-label="复习笔记侧边栏">
                <div class="panel-heading compact-heading scene-note-panel-header">
                  <div class="scene-note-header-main">
                    <h3 id="reviewNoteModalTitle">复习笔记</h3>
                    <span id="reviewNoteStatus" class="scene-note-status"></span>
                  </div>
                  <div class="inline-actions">
                    <button class="secondary-button compact" id="reviewNotePreviewBtn" type="button" title="切换预览/编辑 (⌘E)">👁️ 预览</button>
                    <button class="icon-button" id="reviewNoteModalCloseBtn" type="button" title="收起 (Esc)" aria-label="收起笔记">×</button>
                  </div>
                </div>
                <div class="scene-note-panel-body">
                  <textarea id="reviewNoteInput" class="scene-note-input hidden" rows="12" placeholder="支持 Markdown"></textarea>
                  <div id="reviewNotePreview" class="scene-note-preview"></div>
                </div>
              </aside>
            </div>
          </section>
