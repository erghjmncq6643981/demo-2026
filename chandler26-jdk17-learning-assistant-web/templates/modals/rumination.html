    <!-- 新建知识反刍场景弹窗 -->
    <section class="modal-backdrop hidden" id="addRuminationScenarioModal" aria-modal="true" role="dialog">

        <div class="panel-heading">
          <div>
            <p class="eyebrow">Knowledge Rumination</p>
            <h3>新建场景</h3>
          </div>
          <button class="icon-button" id="closeScenarioModalBtn" type="button" title="关闭">×</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px; padding: 12px 0;">
          <label class="compact-field" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%;">
            <span style="font-size: 13px; font-weight: 600; color: #cbd5e1;">场景名称</span>
            <input id="newScenarioNameInput" type="text" placeholder="例如：🛒 零售超市与日常购物" style="width: 100%; box-sizing: border-box;" />
          </label>

          <label class="compact-field" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%;">
            <span style="font-size: 13px; font-weight: 600; color: #cbd5e1;">场景主题与提示词</span>
            <textarea id="newScenarioPromptInput" rows="3" placeholder="例如：超市日用品、蔬菜水果称重选购、收银结账与退换货对话高频语境" style="width: 100%; box-sizing: border-box; resize: vertical;"></textarea>
          </label>

          <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 8px; padding: 12px; font-size: 12px; color: #94a3b8; line-height: 1.6;">
            💡 <strong style="color: #38bdf8;">智能拓扑生成：</strong>
            系统将基于当前词本词汇与场景描述，智能聚类关联核心词。

        </div>

        <div class="modal-actions" style="margin-top: 16px;">
          <button class="secondary-button" id="cancelScenarioModalBtn" type="button">取消</button>
          <button class="primary-button" id="submitCreateScenarioBtn" type="button">✨ 创建图谱</button>

    <!-- 图谱节点手动维护弹窗（新增/修改） -->
    <section class="modal-backdrop hidden" id="ruminationNodeEditModal" aria-modal="true" role="dialog">
      <div class="config-modal" style="max-width: 480px;">
        <div class="panel-heading">
          <div>
            <p class="eyebrow" id="nodeModalEyebrow">Knowledge Rumination</p>
            <h3 id="nodeModalTitle">新增关联节点</h3>
          </div>
          <button class="icon-button" id="closeNodeModalBtn" type="button" title="关闭">×</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px; padding: 12px 0;">
          <div id="nodeModalParentInfo" style="font-size: 12px; color: #94a3b8; background: rgba(30, 41, 59, 0.6); padding: 8px 12px; border-radius: 6px; border-left: 3px solid #38bdf8;">
            父级锚点：<strong id="nodeModalParentTerm" style="color: #38bdf8;">potato</strong>
          </div>

          <label class="compact-field" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%;">
            <span style="font-size: 13px; font-weight: 600; color: #cbd5e1;">英文词汇 / 短语 <span style="color: #ef4444;">*</span></span>
            <input id="nodeModalTermInput" type="text" placeholder="例如：strawberry / peel / cozy" style="width: 100%; box-sizing: border-box;" />
          </label>

          <label class="compact-field" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%;">
            <span style="font-size: 13px; font-weight: 600; color: #cbd5e1;">中文释义</span>
            <input id="nodeModalDefInput" type="text" placeholder="例如：草莓；留空将自动补全" style="width: 100%; box-sizing: border-box;" />
          </label>

          <label class="compact-field" id="nodeModalDimensionField" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%;">
            <span style="font-size: 13px; font-weight: 600; color: #cbd5e1;">关联关系类型</span>
            <select id="nodeModalDimensionSelect" style="width: 100%; height: 36px; box-sizing: border-box;">
              <option value="peer">同类归属（子分类 / 同族词汇）</option>
              <option value="action">动作搭配（关联动词 / 常用动作）</option>
              <option value="attribute">特征属性（状态修饰 / 感官特征）</option>
              <option value="downstream">衍生关联（下游产物 / 场景延展）</option>
              <option value="synonym">近义词簇（紧凑并排虚线框聚合）</option>
            </select>
          </label>

          <label class="compact-field hidden" id="nodeModalSynonymGroupField" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%;">

            <input id="nodeModalSynonymGroupInput" type="text" placeholder="如：楼梯 / 毯被（可选）" style="width: 100%; box-sizing: border-box;" />
          </label>
        </div>

        <div class="modal-actions" style="margin-top: 14px;">
          <button class="secondary-button" id="cancelNodeModalBtn" type="button">取消</button>
          <button class="primary-button" id="submitNodeModalBtn" type="button">保存并同步星系</button>
