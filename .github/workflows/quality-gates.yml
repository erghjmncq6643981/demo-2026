name: Quality gates

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chandler26-jdk17-learning-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q test
      - run: mvn -B -q -DskipTests compile
      - run: mvn -B -q dependency:analyze -DignoreNonCompile

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chandler26-jdk17-learning-assistant-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chandler26-jdk17-learning-assistant-web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
