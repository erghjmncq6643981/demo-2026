server:
  port: 17680
spring:
  application:
    name: motivation-platform

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

  datasource:
    username: micro
    password: 123456
    url: jdbc:mysql://localhost:3306/motivation?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&autoReconnectForPools=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-packag: com.chandler.*.domain

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

motivation:
  security:
    jwt-secret: change-this-dev-secret-change-before-production
    token-expire-hours: 168

info:
  app:
    name: ${spring.application.name}
    description: @project.description@
    version: @project.version@
    java:
      version: @java.version@

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
